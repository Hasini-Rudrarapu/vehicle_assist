<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Select Breakdown Type</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h2>Select Type of Breakdown</h2>
  <select id="breakdownType">
    <option value="">-- Choose --</option>
    <option value="Engine Failure">Engine Failure</option>
    <option value="Flat Tyre">Flat Tyre</option>
    <option value="Battery Issue">Battery Issue</option>
    <option value="Fuel Problem">Fuel Problem</option>
    <option value="other">Miscellaneous</option>
  </select>
  <button onclick='requestHelp(${JSON.stringify(m)}, ${index})'>Request Help</button>


  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFtX3UnOIHN5j3rxjx7dB_CNeGf0332DQ",
      authDomain: "vehicle-breakdown-38d5c.firebaseapp.com",
      projectId: "vehicle-breakdown-38d5c",
      storageBucket: "vehicle-breakdown-38d5c.appspot.com",
      messagingSenderId: "53685685402",
      appId: "1:53685685402:web:ebf22cabc4f787e1f0a323"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function submitBreakdown() {
      const breakdownType = document.getElementById('breakdownType').value;
      if (!breakdownType) {
        alert("Please select a breakdown type.");
        return;
      }

      const mechanic = JSON.parse(sessionStorage.getItem('selectedMechanic'));

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          db.collection("help_requests").add({
            mechanic: mechanic.name,
            breakdown_type: breakdownType,
            user_location: new firebase.firestore.GeoPoint(lat, lng),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            alert("✅ Thank you! Your request has been submitted.");
            window.location.href = "/tracking";
          }).catch(error => {
            console.error("Error:", error);
            alert("❌ Something went wrong. Try again.");
          });

        }, () => {
          alert("Location access denied.");
        });
      } else {
        alert("Geolocation not supported.");
      }
    }
  </script>
</body>
</html>

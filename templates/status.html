<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" style="margin: 20px; color: green;">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <p><a href="{{ url_for('mechanic_list') }}">🔧 Back to Mechanic List</a></p>
</body>
</html>

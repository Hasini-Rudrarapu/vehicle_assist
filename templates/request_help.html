<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request Help</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}"></script>
</head>
<body class="container py-4">
    <h2 class="text-center mb-4">🚗 Request Mechanic Assistance</h2>

    <form method="POST" action="{{ url_for('request_help') }}" id="helpForm" class="card p-4 shadow-sm">
        <h5 class="mb-3">🔧 Breakdown Details</h5>

        <div class="mb-3">
            <label for="mechanic_id" class="form-label">Select Mechanic:</label>
            <select name="mechanic_id" id="mechanic_id" class="form-select" required>
                <option value="">-- Select Mechanic --</option>
                {% for mechanic in mechanics %}
                    <option value="{{ mechanic.id }}">{{ mechanic.name }} - {{ mechanic.address }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="breakdown_type" class="form-label">Breakdown Type:</label>
            <select name="breakdown_type" id="breakdown_type" class="form-select" required>
                <option value="">-- Select Type --</option>
                <option value="Sudden Stop">Sudden Stop</option>
                <option value="Flat Tire">Flat Tire</option>
                <option value="Battery Issue">Battery Issue</option>
                <option value="Engine Overheat">Engine Overheat</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <input type="hidden" name="latitude" id="latitude" />
        <input type="hidden" name="longitude" id="longitude" />

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">📍 Request Help</button>
        </div>

        <div id="status" class="text-danger mt-3 text-center"></div>
    </form>

    {% if mechanic %}
    <div class="mt-5">
        <h4>📡 Live Tracking</h4>
        <div id="map" style="height: 400px; width: 100%;" class="mb-3 border"></div>
        <p><strong>💰 Estimated Cost:</strong> ${{ cost }}</p>
    </div>
    {% endif %}

    <div class="mt-4 text-center">
        <a href="{{ url_for('mechanic_list') }}" class="btn btn-outline-secondary me-2">🔙 Back to Mechanic List</a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">🚪 Logout</a>
    </div>

    <script>
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        document.getElementById("latitude").value = position.coords.latitude;
                        document.getElementById("longitude").value = position.coords.longitude;
                        document.getElementById("helpForm").submit();
                    },
                    function(error) {
                        document.getElementById("status").innerText =
                            "⚠️ Location access denied. Please enable it for accurate help.";
                    }
                );
            } else {
                document.getElementById("status").innerText =
                    "Geolocation is not supported by this browser.";
            }
        }

        document.getElementById("helpForm").addEventListener("submit", function(e) {
            if (!document.getElementById("latitude").value || !document.getElementById("longitude").value) {
                e.preventDefault();
                getUserLocation();
            }
        });

        {% if mechanic %}
        function initMap() {
            const mechanicLocation = {
                lat: parseFloat('{{ mechanic.latitude }}'),
                lng: parseFloat('{{ mechanic.longitude }}')
            };
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                center: mechanicLocation
            });
            new google.maps.Marker({
                position: mechanicLocation,
                map: map,
                title: '{{ mechanic.name }}'
            });
        }
        window.onload = initMap;
        {% endif %}
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mechanics Near You</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #map {
      height: 400px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .mechanic-card {
      background: #fff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }

    .mechanic-card h3 {
      margin-top: 0;
    }

    .mechanic-card button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .mechanic-card button:hover {
      background-color: #0056b3;
    }

    .logout {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .logout a {
      text-decoration: none;
      background-color: #dc3545;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
    }

    .logout a:hover {
      background-color: #b02a37;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: white;
      margin: 15% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .modal select {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
    }

    .modal button {
      margin-top: 20px;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    .modal button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h2>Mechanics Near You</h2>
  <div id="map"></div>
  <div id="mechanicList"></div>

  <div class="logout">
    <a href="/logout">Logout</a>
  </div>

  <!-- Modal for Breakdown Type -->
  <div id="breakdownModal" class="modal">
    <div class="modal-content">
      <h3>Select Breakdown Type</h3>
      <select id="breakdownSelect">
        <option value="">-- Select --</option>
        <option value="Engine Failure">Engine Failure</option>
        <option value="Flat Tire">Flat Tire</option>
        <option value="Battery Issue">Battery Issue</option>
        <option value="Brake Problem">Brake Problem</option>
        <option value="Other">Other</option>
      </select>
      <button id="confirmRequestBtn">Confirm Request</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAFtX3UnOIHN5j3rxjx7dB_CNeGf0332DQ",
      authDomain: "vehicle-breakdown-38d5c.firebaseapp.com",
      projectId: "vehicle-breakdown-38d5c",
      storageBucket: "vehicle-breakdown-38d5c.appspot.com",
      messagingSenderId: "53685685402",
      appId: "1:53685685402:web:ebf22cabc4f787e1f0a323"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Initialize map
    const map = L.map('map').setView([17.9784, 79.5911], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Mechanics array
    const mechanics = [
      { name: "Raju Bike Works", lat: 17.9812, lng: 79.5954, address: "Subedari, Hanamkonda", phone: "+91 91234 56789" },
      { name: "Lucky Auto Repairs", lat: 17.9750, lng: 79.5888, address: "NIT Road, Hanamkonda", phone: "+91 99887 65432" },
      { name: "Hanamkonda Auto Garage", lat: 17.9740, lng: 79.6001, address: "MG Road, Hanamkonda", phone: "+91 90000 12345" },
      { name: "Sri Sai Motors", lat: 17.9825, lng: 79.5890, address: "Kakaji Colony, Hanamkonda", phone: "+91 7601084843" }
    ];

    // Add markers for each mechanic
    mechanics.forEach(m => {
      L.marker([m.lat, m.lng]).addTo(map)
        .bindPopup(`<b>${m.name}</b><br>${m.address}<br>📞 ${m.phone}`);
    });

    // Show user location if allowed
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        L.marker([userLat, userLng], {
          icon: L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32]
          })
        }).addTo(map).bindPopup("📍 You are here").openPopup();

        map.setView([userLat, userLng], 14);
      }, () => {
        alert("Location access denied. Showing default area.");
      });
    } else {
      alert("Geolocation is not supported by your browser.");
    }

    // Display mechanic cards
    const mechanicListDiv = document.getElementById('mechanicList');
    let selectedMechanic = null;

    mechanics.forEach(m => {
      const card = document.createElement('div');
      card.className = 'mechanic-card';
      card.innerHTML = `
        <h3>${m.name}</h3>
        <p>${m.address}, Telangana</p>
        <p>📞 ${m.phone}</p>
        <button onclick="openModal('${m.name}')">Request Help</button>
      `;
      mechanicListDiv.appendChild(card);
    });

    // Modal handling
    function openModal(mechanicName) {
      selectedMechanic = mechanicName;
      document.getElementById('breakdownModal').style.display = 'block';
    }

    document.getElementById('confirmRequestBtn').onclick = () => {
      const breakdownType = document.getElementById('breakdownSelect').value;

      if (!breakdownType) {
        alert("Please select a breakdown type.");
        return;
      }

      if (!navigator.geolocation) {
        alert("Geolocation not supported.");
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        db.collection("help_requests").add({
          mechanic: selectedMechanic,
          breakdown_type: breakdownType,
          user_location: new firebase.firestore.GeoPoint(userLat, userLng),
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          alert(`Help requested from ${selectedMechanic} for: ${breakdownType}`);
          document.getElementById('breakdownModal').style.display = 'none';
        }).catch(error => {
          console.error("Error sending help request:", error);
          alert("Failed to send help request.");
        });
      }, () => {
        alert("Location access denied.");
      });
    };

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('breakdownModal');
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vehicle Breakdown Assistance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        input, button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 250px;
        }
        #message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
    <div id="message"></div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase config (use actual credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyAFtX3UnOIHN5j3rxjx7dB_CNeGf0332DQ",
            authDomain: "vehicle-breakdown-38d5c.firebaseapp.com",
            projectId: "vehicle-breakdown-38d5c",
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = '';

            try {
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const idToken = await userCredential.user.getIdToken();

                const response = await fetch('/sessionLogin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idToken })
                });

                if (response.ok) {
                    window.location.href = '/mechanics';
                } else {
                    messageDiv.textContent = 'Login failed. Please try again.';
                }
            } catch (error) {
                messageDiv.textContent = 'Login error: ' + error.message;
            }
        });
    </script>
</body>
</html>
